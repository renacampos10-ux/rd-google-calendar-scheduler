name: RD Google Outbox - Production Recovery

on:
  workflow_run:
    workflows:
      - "RD Google Outbox - Production (Controlled Activation)"
    types:
      - completed
    branches:
      - main

permissions:
  actions: write
  contents: read

concurrency:
  group: rd-google-outbox-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Validate recovery eligibility
        id: eligibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          EXPECTED_WORKFLOW: RD Google Outbox - Production (Controlled Activation)
        run: |
          set -euo pipefail

          fail_closed() {
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }

          run_json="$(gh api -H "Accept: application/vnd.github+json" "/repos/$REPO/actions/runs/$RUN_ID")" || fail_closed "run_read_failed"
          jobs_json="$(gh api -H "Accept: application/vnd.github+json" "/repos/$REPO/actions/runs/$RUN_ID/jobs")" || fail_closed "jobs_read_failed"

          workflow_name="$(jq -r '.name // empty' <<<"$run_json")"
          event_name="$(jq -r '.event // empty' <<<"$run_json")"
          head_branch="$(jq -r '.head_branch // empty' <<<"$run_json")"
          run_attempt="$(jq -r '.run_attempt // empty' <<<"$run_json")"
          run_status="$(jq -r '.status // empty' <<<"$run_json")"
          run_conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
          head_sha="$(jq -r '.head_sha // empty' <<<"$run_json")"

          [[ "$workflow_name" == "$EXPECTED_WORKFLOW" ]] || fail_closed "workflow_mismatch"
          [[ "$event_name" == "schedule" ]] || fail_closed "event_mismatch"
          [[ "$head_branch" == "main" ]] || fail_closed "branch_mismatch"
          [[ "$run_attempt" == "1" ]] || fail_closed "attempt_not_one"
          [[ "$run_status" == "completed" ]] || fail_closed "run_not_completed"
          [[ "$run_conclusion" == "failure" ]] || fail_closed "run_not_failure"

          job_count="$(jq -r '.total_count // 0' <<<"$jobs_json")"
          [[ "$job_count" == "1" ]] || fail_closed "job_count_mismatch"

          job_name="$(jq -r '.jobs[0].name // empty' <<<"$jobs_json")"
          job_conclusion="$(jq -r '.jobs[0].conclusion // empty' <<<"$jobs_json")"
          runner_id="$(jq -r '.jobs[0].runner_id // empty' <<<"$jobs_json")"
          runner_name="$(jq -r '.jobs[0].runner_name // empty' <<<"$jobs_json")"
          steps_count="$(jq -r '(.jobs[0].steps // []) | length' <<<"$jobs_json")"

          [[ "$job_name" == "trigger" ]] || fail_closed "job_name_mismatch"
          [[ "$job_conclusion" == "cancelled" ]] || fail_closed "job_not_cancelled"
          [[ "$runner_id" == "0" ]] || fail_closed "runner_id_not_zero"
          [[ -z "$runner_name" ]] || fail_closed "runner_name_present"
          [[ "$steps_count" == "0" ]] || fail_closed "steps_present"

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "reason=eligible" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Recheck and request one rerun
        if: ${{ steps.eligibility.outputs.eligible == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          current_json="$(gh api -H "Accept: application/vnd.github+json" "/repos/$REPO/actions/runs/$RUN_ID")" || exit 0

          current_attempt="$(jq -r '.run_attempt // empty' <<<"$current_json")"
          current_status="$(jq -r '.status // empty' <<<"$current_json")"
          current_conclusion="$(jq -r '.conclusion // empty' <<<"$current_json")"

          if [[ "$current_attempt" != "1" || "$current_status" != "completed" || "$current_conclusion" != "failure" ]]; then
            echo "Recovery skipped: state changed before rerun request."
            exit 0
          fi

          response_file="$(mktemp)"
          set +e
          status="$(
            curl               --silent               --show-error               --output "$response_file"               --write-out '%{http_code}'               --request POST               --header "Accept: application/vnd.github+json"               --header "Authorization: Bearer $GH_TOKEN"               --header "X-GitHub-Api-Version: 2022-11-28"               --max-time 30               "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/rerun"
          )"
          curl_exit_code=$?
          set -e

          if [[ "$curl_exit_code" != "0" ]]; then
            echo "Rerun request response uncertain; no automatic second POST will be attempted."
            gh api -H "Accept: application/vnd.github+json" "/repos/$REPO/actions/runs/$RUN_ID" >/dev/null 2>&1 || true
            exit 0
          fi

          if [[ "$status" == "201" ]]; then
            echo "Rerun request accepted for run_id=$RUN_ID"
            exit 0
          fi

          echo "Rerun request rejected with HTTP $status; no retry will be attempted."
          exit 0
