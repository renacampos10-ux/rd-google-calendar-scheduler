name: RD Google Outbox - Homologacao

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions: {}

concurrency:
  group: rd-google-outbox-homologacao
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TARGET_URL: https://rd-agenda-google-homologacao.renacampos10.chatgpt.site/api/rd/integrations/google/internal/process-outbox
      HEALTH_URL: https://rd-agenda-google-homologacao.renacampos10.chatgpt.site/api/rd/integrations/google/homologation/health
      SCHEDULER_SECRET: ${{ secrets.RD_GOOGLE_SCHEDULER_SECRET }}
    steps:
      - name: Validate homologation target and secret
        shell: bash
        run: |
          test "$TARGET_URL" = "https://rd-agenda-google-homologacao.renacampos10.chatgpt.site/api/rd/integrations/google/internal/process-outbox"
          test "$HEALTH_URL" = "https://rd-agenda-google-homologacao.renacampos10.chatgpt.site/api/rd/integrations/google/homologation/health"
          test -n "$SCHEDULER_SECRET"

      - name: Validate isolated Google schema
        shell: bash
        run: |
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 55 "$HEALTH_URL")"
          echo "Health HTTP status: $status"
          test "$status" = "200"

      - name: Validate Bearer protection and trigger outbox
        shell: bash
        run: |
          missing="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request POST --max-time 55 "$TARGET_URL")"
          wrong="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request POST --header "Authorization: Bearer xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" --max-time 55 "$TARGET_URL")"
          correct="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request POST --header "Authorization: Bearer ${SCHEDULER_SECRET}" --max-time 55 "$TARGET_URL")"
          echo "Missing Bearer HTTP status: $missing"
          echo "Wrong Bearer HTTP status: $wrong"
          echo "Correct Bearer HTTP status: $correct"
          test "$missing" = "401"
          test "$wrong" = "401"
          test "$correct" = "200"
