name: RD Google Outbox - Homologacao

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: rd-google-outbox-homologacao
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CLEANUP_URL: https://rd-agenda-google-homologacao.renacampos10.chatgpt.site/api/rd/integrations/google/testing/cleanup-outbox-fixtures
      STATUS_URL: https://rd-agenda-google-homologacao.renacampos10.chatgpt.site/api/rd/integrations/google/testing/outbox-fixture-status
      SCHEDULER_SECRET: ${{ secrets.RD_GOOGLE_SCHEDULER_SECRET }}
    steps:
      - name: Validate homologation cleanup target
        shell: bash
        run: |
          test "$CLEANUP_URL" = "https://rd-agenda-google-homologacao.renacampos10.chatgpt.site/api/rd/integrations/google/testing/cleanup-outbox-fixtures"
          test "$STATUS_URL" = "https://rd-agenda-google-homologacao.renacampos10.chatgpt.site/api/rd/integrations/google/testing/outbox-fixture-status"
          test -n "$SCHEDULER_SECRET"

      - name: Logically disable synthetic fixtures
        shell: bash
        run: |
          body="$(curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer ${SCHEDULER_SECRET}" --max-time 55 "$CLEANUP_URL")"
          echo "$body"
          test "$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin)["cleanup"]["logicalCleanup"])')" = "True"

      - name: Confirm synthetic runtime data disabled
        shell: bash
        run: |
          body="$(curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer ${SCHEDULER_SECRET}" --max-time 55 "$STATUS_URL")"
          echo "$body"
          printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin)["fixtures"]; assert d["syntheticOnly"] is True; assert all(x["status"] == "DISABLED" for x in d["outbox"]); assert all(x["sync_status"] == "DISABLED" for x in d["links"])'
