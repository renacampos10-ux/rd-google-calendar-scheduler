name: RD Google Outbox - Production (Controlled Activation)

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/rd-google-outbox-production.yml

permissions: {}

concurrency:
  group: rd-google-outbox-production
  cancel-in-progress: false

jobs:
  trigger:
    if: ${{ github.event_name == 'push' || vars.RD_GOOGLE_PRODUCTION_SCHEDULER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TARGET_URL: ${{ vars.RD_GOOGLE_PROD_ENDPOINT }}
      SCHEDULER_SECRET: ${{ secrets.RD_GOOGLE_PROD_SCHEDULER_SECRET }}
    steps:
      - name: Validate production target and secret
        shell: bash
        run: |
          test "$TARGET_URL" = "https://orcard-rd-moveis.renacampos10.chatgpt.site/api/rd/integrations/google/internal/process-outbox"
          test -n "$SCHEDULER_SECRET"

      - name: Trigger controlled production sync
        shell: bash
        run: |
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' --request POST --header "Authorization: Bearer ${SCHEDULER_SECRET}" --max-time 55 "$TARGET_URL")"
          echo "Production sync HTTP status: $status"
          if test "$status" = "200"; then
            jq -c '{status, inbound: .execution.inbound, outbound: .execution.outbound}' "$response_file"
          else
            jq -c '{error_code: .error.code}' "$response_file"
          fi
          test "$status" = "200"
